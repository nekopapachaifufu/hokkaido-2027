name: fetch-spot-images
on:
  workflow_dispatch:
  push:
    paths: ["tools/spots.json", "tools/fetch_images.py"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/fetch_images.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add img/spots
          git commit -m "Fetch spot images from Wikimedia Commons" || echo "nothing to commit"
          git push
